# Standalone Standard Firewall Policy intent; no firewall instances or seed data.
version: '1.0'
nodes:
- namespace: Azure
  include_in_menu: false
  display_label: name__value
  attributes:
  - name: status
    label: Status
    kind: Dropdown
    optional: true
    default_value: planned
    order_weight: 1200
    choices:
    - name: planned
      label: Planned
      color: '#a855f7'
      description: Intended configuration that has not yet been provisioned.
    - name: active
      label: Active
      color: '#00d25b'
      description: Provisioned and in use.
    - name: reserved
      label: Reserved
      color: '#4d90fe'
      description: Held for future use.
    - name: deprecated
      label: Deprecated
      color: '#e04040'
      description: Being retired or no longer recommended for use.
    - name: unmanaged
      label: Unmanaged
      color: '#9ca3af'
      description: Azure-managed reference configuration, outside our provisioning
        lifecycle.
  - name: description
    kind: Text
    optional: true
  - name: name
    kind: Text
    optional: false
    parameters:
      min_length: 1
      max_length: 80
      regex: ^[A-Za-z0-9](?:[A-Za-z0-9_.-]*[A-Za-z0-9_])?\Z
  - name: name_key
    label: Normalized Name
    description: Computed lowercase name used for owner-scoped uniqueness.
    kind: Text
    read_only: true
    optional: false
    computed_attribute:
      kind: Jinja2
      jinja2_template: '{{ name__value | lower }}'
  - name: sku
    kind: Dropdown
    optional: false
    choices:
    - name: Standard
      label: Standard
    default_value: Standard
  - name: threat_intelligence_mode
    kind: Dropdown
    optional: false
    choices:
    - name: 'Off'
      label: 'Off'
    - name: Alert
      label: Alert
    - name: Deny
      label: Deny
    default_value: Alert
  - name: dns_proxy_enabled
    kind: Boolean
    optional: false
    default_value: false
  - name: dns_servers
    kind: Text
    optional: true
    description: Optional comma-separated DNS server IPv4 addresses. Empty uses Azure-provided
      DNS.
  name: FirewallPolicy
  label: Firewall Policies
  relationships:
  - name: location
    label: Region
    peer: AzureRegion
    kind: Attribute
    cardinality: one
    optional: false
  - name: collection_groups
    peer: AzureFirewallRuleCollectionGroup
    kind: Component
    cardinality: many
    optional: true
    identifier: azure_firewall__firewallrulecollectiongroup
  uniqueness_constraints:
  - - resourcegroup
    - name_key__value
  inherit_from:
  - AzureResource
  - AzureTaggable
