    description: Comma-separated TCP and/or UDP.
  - name: translated_address
    kind: Text
    optional: true
    description: Exactly one translated IPv4 address or translated_fqdn is required.
  - name: translated_fqdn
    kind: Text
    optional: true
    description: Exact backend FQDN; mutually exclusive with translated_address.
  - name: translated_port
    kind: Number
    optional: false
    parameters:
      min_value: 1
      max_value: 63999
