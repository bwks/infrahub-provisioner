  - name: destination_addresses
    kind: Text
    optional: true
    description: Comma-separated IPv4 addresses, CIDRs, ranges or service tags; *
      must stand alone.
  - name: destination_fqdns
    kind: Text
    optional: true
    description: Comma-separated exact host FQDNs; requires policy DNS proxy. No wildcard.
  - name: protocols
    kind: Text
    optional: false
    description: Comma-separated TCP, UDP, ICMP, or Any alone.
  - name: destination_ports
    kind: Text
    optional: false
    description: Comma-separated ports/ranges, or * alone. ICMP requires *.
