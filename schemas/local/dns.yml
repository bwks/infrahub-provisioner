    - name: unmanaged
      label: Unmanaged
      color: '#9ca3af'
      description: Azure-managed reference configuration, outside our provisioning
        lifecycle.
  - name: description
    kind: Text
    optional: true
  - name: name
    kind: Text
    optional: false
    parameters:
      min_length: 1
      max_length: 253
  - name: name_key
    label: Normalized Name
    kind: Text
    optional: false
    read_only: true
    computed_attribute:
      kind: Jinja2
      jinja2_template: '{{ name__value | lower }}'
  - name: record_type
    kind: Dropdown
    optional: false
    choices:
    - name: A
      label: A
    - name: AAAA
      label: AAAA
    - name: CNAME
      label: CNAME
    - name: TXT
      label: TXT
  - name: ttl
    kind: Number
    optional: false
    default_value: 3600
    parameters:
      min_value: 1
      max_value: 2147483647
  - name: records
    kind: JSON
    optional: false
    description: 'A/AAAA/CNAME: list of literal strings. TXT: list of records, each
      a list of text chunks (up to 255 bytes per chunk).'
  relationships:
  - name: zone
    peer: AzurePrivateDnsZone
    kind: Parent
    cardinality: one
    optional: false
    identifier: azure_private_dns_zone__records
  uniqueness_constraints:
  - - zone
    - name_key__value
    - record_type__value
- name: DnsPrivateResolver
  namespace: Azure
  label: DNS Private Resolvers
  include_in_menu: false
  display_label: name__value
