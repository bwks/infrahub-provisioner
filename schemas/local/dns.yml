    parameters:
      min_length: 1
      max_length: 80
      regex: ^[A-Za-z0-9](?:[A-Za-z0-9_-]*[A-Za-z0-9])?\Z
  - name: name_key
    label: Normalized Name
    kind: Text
    optional: false
