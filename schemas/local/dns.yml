    - name: unmanaged
      label: Unmanaged
      color: '#9ca3af'
      description: Azure-managed reference configuration, outside our provisioning
        lifecycle.
  - name: description
    kind: Text
    optional: true
  - name: name
    kind: Text
    optional: false
    parameters:
      min_length: 1
      max_length: 80
  - name: name_key
    label: Normalized Name
    kind: Text
    optional: false
    read_only: true
    computed_attribute:
      kind: Jinja2
      jinja2_template: '{{ name__value | lower }}'
  - name: registration_enabled
    kind: Boolean
    optional: false
    default_value: false
  relationships:
  - name: zone
    peer: AzurePrivateDnsZone
    kind: Parent
    cardinality: one
    optional: false
    identifier: azure_private_dns_zone__links
  - name: virtual_network
    peer: AzureVirtualNetwork
    kind: Attribute
    cardinality: one
    optional: false
    identifier: azure_vnet__private_dns_links
  uniqueness_constraints:
  - - zone
    - name_key__value
  - - zone
    - virtual_network
- name: PrivateDnsRecordSet
  namespace: Azure
  label: Private DNS Record Sets
  include_in_menu: false
  display_label: '{{ name__value }} ({{ record_type__value }})'
  attributes:
  - name: status
    label: Status
    kind: Dropdown
    optional: true
    default_value: planned
    order_weight: 1200
    choices:
    - name: planned
      label: Planned
      color: '#a855f7'
      description: Intended configuration that has not yet been provisioned.
    - name: active
      label: Active
      color: '#00d25b'
      description: Provisioned and in use.
    - name: reserved
      label: Reserved
      color: '#4d90fe'
      description: Held for future use.
    - name: deprecated
      label: Deprecated
      color: '#e04040'
