      max_length: 253
    description: Enter the complete zone name for Custom or a template containing
      braces. Leave empty for fixed Azure zone choices.
  - name: name
    kind: Text
    optional: false
    parameters:
      min_length: 1
      max_length: 253
    read_only: true
    computed_attribute:
      kind: Jinja2
      jinja2_template: '{{ ((custom_name__value or '''') if zone_selection__value
        == ''custom'' or ''{'' in (zone_selection__value or '''') else (zone_selection__value
        or '''')) | lower }}'
    label: Zone Name
  - name: name_key
    label: Normalized Name
    kind: Text
    optional: false
    read_only: true
    computed_attribute:
      kind: Jinja2
      jinja2_template: '{{ ((custom_name__value or '''') if zone_selection__value
