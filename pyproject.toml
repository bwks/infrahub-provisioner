[project]
name = "infrahub-provisioner"
version = "0.1.0"
description = "Schemas and provisioning workflow for the Infrahub lab"
requires-python = ">=3.12,<3.15"
dependencies = [
    "infrahub-sdk[ctl]==1.22.1",
    "pyyaml==6.0.3",
    "typer==0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
